<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/neon-dreams-hotel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Dreams</title>
    <script>
      // Force the background color immediately to avoid a white flash
      const theme =
        localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light');

      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#17191e';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#fafbfc';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
